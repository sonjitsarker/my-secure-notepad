      - name: Install Dependencies & Build Web App
        run: |
          npm install
          npm run build

      - name: Generate Android Project & Build APK
        run: |
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Download Ready Android APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Secure-Notepad-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
